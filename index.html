<body class="text-slate-800 antialiased flex flex-col min-h-screen">

      { id: "3-2-1-4", domain: "3", std: "التطور الشخصي والصحي", text: "يشارك المتعلمون في الأنشطة المجتمعية والأعمال التطوعية.", evs: ["سجل حصر الساعات التطوعية المعتمدة للطلاب.", "توثيق المبادرات التطوعية والميدانية المنفذة من الطلاب.", "شهادات الشكر والتقدير المقدمة للطلاب."] },
      { id: "3-2-1-5", domain: "3", std: "التطور الشخصي والصحي", text: "يلتزم المتعلمون بقواعد السلوك والانضباط المدرسي.", evs: ["التقارير الإحصائية لسجلات الغياب والمخالفات السلوكية.", "انخفاض معدلات التنمر والمخالفات وفق سجلات التوجيه.", "سجلات تكريم ذوي السلوك المثالي والانتظام."] },
      { id: "3-2-1-6", domain: "3", std: "التطور الشخصي والصحي", text: "يظهر المتعلمون الاستقلالية والقدرة على التعلم الذاتي.", evs: ["مشاريع التعلم الذاتي والأبحاث الفردية للطلاب.", "ملفات الإنجاز الرقمية المستقلة وتقارير القراءة الحرة.", "اجتياز الطلاب لدورات تدريبية عبر المنصات التعليمية."] },
      { id: "3-2-1-7", domain: "3", std: "التطور الشخصي والصحي", text: "يظهر المتعلمون اعتزازاً بثقافتهم واحتراماً للتنوع الثقافي في المجتمع.", evs: ["الأنشطة التوعوية المعززة للتسامح والتعايش.", "مشاركات الطلاب في الفعاليات الحوارية ونبذ التعصب.", "تقارير الممارسات الإيجابية المعبرة عن الاحترام المتبادل."] },

      { id: "4-1-1-1", domain: "4", std: "المبنى المدرسي", text: "توفر المدرسة مبنى تعليمي يستوفي المواصفات والاشتراطات المعتمدة.", evs: ["صك الملكية أو عقد الإيجار ورخصة البلدية.", "شهادة إتمام البناء ومطابقة كود البناء السعودي.", "تراخيص الدفاع المدني وسلامة المنشأة التعليمية."] },
      { id: "4-1-1-2", domain: "4", std: "المبنى المدرسي", text: "تنظيم مبنى المدرسة ملائم لعدد المتعلمين وخصائص المرحلة العمرية.", evs: ["المخطط الهندسي لتوزيع الفصول وتناسب الكثافة.", "توفر المنحدرات والممرات الخاصة لذوي الإعاقة.", "اللوحات الإرشادية والتحذيرية الملائمة."] },
      { id: "4-1-1-3", domain: "4", std: "المبنى المدرسي", text: "تتوافر فصول ومعامل ملائمة للعملية التعليمية تلبي احتياجات المتعلمين.", evs: ["سجلات حصر وتجهيزات الفصول الدراسية والتكييف.", "جاهزية معامل العلوم والحاسب وتوفر أدوات السلامة.", "جداول إشغال المعامل والأنشطة العملية بها."] },
      { id: "4-1-1-4", domain: "4", std: "المبنى المدرسي", text: "تلبي المرافق والتجهيزات والخدمات المساندة احتياجات المتعلمين.", evs: ["جاهزية الملاعب الرياضية، الساحات المغطاة والمصلى.", "دورات مياه مهيأة ومطابقة للاشتراطات ومناسبة لذوي الإعاقة.", "تجهيزات العيادة المدرسية والخدمات المساندة."] },
      { id: "4-2-1-1", domain: "4", std: "الأمن والسلامة", text: "تتوافر في مبنى المدرسة ومرافقها جميع متطلبات الأمن والسلامة.", evs: ["سجلات فحص طفايات الحريق وخراطيم المياه وأجهزة الإنذار.", "مخططات مخارج الطوارئ ومسارات الإخلاء.", "توثيق تنفيذ خطط الإخلاء الافتراضية الدورية."] },

      { id: "4-2-1-3", domain: "4", std: "الأمن والسلامة", text: "تتابع المدرسة نظافة المبنى المدرسي وجميع مرافقه بشكل مستمر.", evs: ["خطة وجدول النظافة اليومية لجميع المرافق والساحات.", "سجلات الإشراف والمتابعة المستمرة لنظافة دورات المياه والعيادة.", "توفر أدوات ومواد النظافة والتعقيم المستمر وعمال النظافة."] }
    ];

    const STORAGE_KEY = "school_individual_links_v5";

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    function saveState(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    let currentDomain = "all";

    function switchDomain(dom) {
      currentDomain = dom;
      document.querySelectorAll(".domain-tab").forEach(tab => {
        tab.className = "domain-tab px-4 py-2 rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 transition";
      });
      const activeTab = document.getElementById("tab-" + dom);
      if (activeTab) {
        activeTab.className = "domain-tab px-4 py-2 rounded-lg bg-teal-800 text-white transition";
      }
      renderCards();
    }

    function renderCards() {
      const state = loadState();
      const container = document.getElementById("indicators-container");

      const filtered = indicatorsData.filter(i => currentDomain === "all" || i.domain === currentDomain);

      let html = "";
      filtered.forEach(item => {
        const indState = state[item.id] || { status: "notstarted", items: {}, note: "" };

        let evidencesHtml = item.evs.map((evText, idx) => {
          const evData = indState.items[idx] || { checked: false, url: "" };
          return `
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-3 rounded bg-slate-50 border border-slate-200">
              <label class="flex items-start gap-2 cursor-pointer flex-1">
                <input type="checkbox" onchange="updateEvidence('${item.id}', ${idx}, 'checked', this.checked)" ${evData.checked ? "checked" : ""} class="w-4 h-4 mt-1 text-teal-600 rounded border-slate-300 focus:ring-teal-500">
                <span class="text-xs font-bold text-slate-700 leading-relaxed">${evText}</span>
              </label>
              <div class="flex items-center gap-2 w-full sm:w-auto mt-2 sm:mt-0 no-print">
                <input type="url" placeholder="ضع رابط الملف لهذا الشاهد (Drive/Cloud)..." value="${evData.url || ''}" onchange="updateEvidence('${item.id}', ${idx}, 'url', this.value)" class="w-full sm:w-72 text-xs rounded border border-slate-300 py-1.5 px-2 focus:outline-none focus:ring-2 focus:ring-teal-500">
                ${evData.url ? `<a href="${evData.url}" target="_blank" class="px-2.5 py-1.5 bg-teal-600 hover:bg-teal-700 text-white rounded text-xs font-bold whitespace-nowrap"><i class="fa-solid fa-arrow-up-right-from-square"></i> فتح</a>` : ''}
              </div>
              <div class="print-only hidden text-xs text-slate-500 mr-8 mt-1">
                الرابط: ${evData.url || "غير متوفر"}
              </div>
            </div>
          `;
        }).join("");

        html += `
          <div class="card bg-white rounded-xl shadow-sm border border-slate-200 p-5 relative overflow-hidden" data-id="${item.id}">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-3 mb-4">
              <div class="flex items-center gap-2">
                <span class="px-3 py-1 bg-teal-50 text-teal-800 font-black text-sm rounded border border-teal-200">${item.id}</span>
                <span class="text-xs font-bold text-slate-600">معيار: ${item.std}</span>
              </div>
              <div class="flex items-center gap-2 no-print">
                <label class="text-xs font-bold text-slate-500">حالة المؤشر:</label>
                <select onchange="updateStatus('${item.id}', this.value)" class="text-xs font-bold py-1 px-2 rounded border focus:outline-none focus:ring-2 focus:ring-teal-500 
                  ${indState.status === 'done' ? 'bg-green-100 text-green-800 border-green-300' : 
                    indState.status === 'pending' ? 'bg-yellow-100 text-yellow-800 border-yellow-300' : 
                    'bg-red-100 text-red-800 border-red-300'}">
                  <option value="notstarted" ${indState.status === 'notstarted' ? 'selected' : ''}>❌ غير مكتمل</option>
                  <option value="pending" ${indState.status === 'pending' ? 'selected' : ''}>⏳ قيد التجهيز</option>
                  <option value="done" ${indState.status === 'done' ? 'selected' : ''}>✅ مكتمل بالكامل</option>
                </select>
              </div>
            </div>

            <h3 class="text-base font-bold text-slate-900 mb-4 leading-relaxed">${item.text}</h3>

            <div class="mb-4">
              <h4 class="text-xs font-black text-teal-900 mb-2 flex items-center gap-1.5"><i class="fa-solid fa-list-check"></i> شواهد المؤشر (ضع الرابط السحابي الخاص بكل شاهد أمامه مباشرة):</h4>
              <div class="space-y-2">
                ${evidencesHtml}
              </div>
            </div>

            <div class="no-print mt-4">
              <input type="text" placeholder="📝 ملاحظات فريق الجودة والتطوير الخاصة بهذا المؤشر..." value="${indState.note || ''}" onchange="updateNote('${item.id}', this.value)" class="w-full text-xs rounded border border-slate-300 py-2 px-3 focus:outline-none focus:ring-2 focus:ring-teal-500 bg-slate-50">
            </div>
            
            <div class="print-only hidden text-xs text-slate-600 mt-2 font-bold">
              ملاحظات: ${indState.note || 'لا توجد'}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function updateEvidence(indId, evIndex, field, val) {
      const state = loadState();
      if (!state[indId]) state[indId] = { status: "notstarted", items: {}, note: "" };
      if (!state[indId].items[evIndex]) state[indId].items[evIndex] = { checked: false, url: "" };
      
      state[indId].items[evIndex][field] = val;

      if (field === 'url' && val && !state[indId].items[evIndex].checked) {
        state[indId].items[evIndex].checked = true;
      }

      saveState(state);
      renderCards();
    }

    function updateStatus(indId, val) {
      const state = loadState();
      if (!state[indId]) state[indId] = { items: {}, note: "" };
      state[indId].status = val;
      saveState(state);
      renderCards();
    }

    function updateNote(indId, val) {
      const state = loadState();
      if (!state[indId]) state[indId] = { status: "notstarted", items: {} };
      state[indId].note = val;
      saveState(state);
    }

    window.addEventListener("DOMContentLoaded", () => {
      renderCards();
    });
  </script>
</body>
</html>
